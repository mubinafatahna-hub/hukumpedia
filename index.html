<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HukumPedia — Kamus Hukum Indonesia</title>
<meta name="description" content="Cari pasal, kitab, dan istilah hukum Indonesia untuk advokat dan mahasiswa hukum.">
<meta name="theme-color" content="#14213D">
<meta name="application-name" content="HukumPedia">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HukumPedia">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F6F1;--card:#fff;--ink:#0F172A;--mute:#334155;--line:#E2DED4;--gold:#D97706;--navy:#0F172A;--onnavy:#F8F6F1;--mark:#FDE7B8}
:root[data-theme=dark]{--bg:#0B1220;--card:#131C2E;--ink:#F1EEE6;--mute:#A9B4C6;--line:#26324A;--navy:#070C16;--mark:#6B4A0E}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;line-height:1.25}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:var(--navy);color:var(--onnavy);position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font:700 22px "Playfair Display",serif;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand span{color:var(--gold)}
#auth{display:flex;gap:8px;align-items:center;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 12px;max-width:100%}
button,.btn{font:500 14px "Plus Jakarta Sans",sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:8px 12px}
button.p{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:700}
button:disabled{opacity:.4;cursor:default}
.lnk{border:0;background:none;color:var(--gold);padding:0;text-decoration:underline;font-size:inherit}
nav{max-width:920px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 14px;color:var(--onnavy);opacity:.75;border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-3px}
nav a.on{opacity:1;border-color:var(--gold);font-weight:700}
body.guest nav,body.guest #theme,body.guest #auth{display:none}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:30px;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px;align-items:center}
.frm{display:grid;gap:8px;max-width:620px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:14px 16px;margin:0 0 10px}
.item:hover{border-color:var(--gold)}
.item b{display:block}
.item small,.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;margin-right:6px;color:var(--mute)}
.bab{margin:28px 0 10px;font-size:18px;border-bottom:1px solid var(--line);padding-bottom:6px}
.grp{margin:26px 0 10px;padding:9px 14px;background:var(--navy);color:var(--onnavy);border-left:4px solid var(--gold);border-radius:4px}
.grp small{display:block;opacity:.75}
.pasal{font:700 40px "Playfair Display",serif;color:var(--gold);margin:0}
.text{font-family:"Playfair Display",Georgia,serif;font-size:19px;line-height:1.8;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin:14px 0;max-width:68ch}
.text p,.pj p{margin:.45em 0}
.text .ay{padding-left:2.4em;text-indent:-2.4em}.text .hu{padding-left:3.8em;text-indent:-1.4em}.text .an{padding-left:5.2em;text-indent:-1.4em}
.pj{border-left:3px solid var(--line);padding-left:14px;color:var(--mute);max-width:68ch}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.crumb{font-size:14px;color:var(--mute);margin-bottom:14px;display:block}
.empty{padding:28px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:6px}
.note{background:var(--mark);border-radius:6px;padding:10px 14px;margin:0 0 18px;font-size:14px}
dt{font:700 17px "Playfair Display",serif;margin-top:16px}
dd{margin:2px 0 0;color:var(--mute);max-width:68ch}
.letter{font:700 26px "Playfair Display",serif;color:var(--gold);margin:26px 0 0;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0}
.chip{padding:4px 9px;min-width:34px}.chip.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.bk{display:flex;flex-direction:column}.bk .book{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.book{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.book:hover{border-color:var(--gold)}
.book .cv{height:120px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font:700 24px "Playfair Display",serif;text-align:center;padding:8px;border-bottom:3px solid var(--gold)}
.book .bd{padding:10px 12px}
.auth{max-width:400px;margin:24px auto}
.vbar{position:sticky;top:var(--hh,110px);z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
#vw{background:#6b7280;padding:12px 8px;display:flex;flex-direction:column;gap:10px;overflow-x:auto;margin-top:8px;border-radius:6px}
.pg{position:relative;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35);flex:none;margin:0 auto;scroll-margin-top:calc(var(--hh,110px) + 70px)}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1}
.textLayer span{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0 0}
.textLayer .hit{background:rgba(255,196,0,.5)}.textLayer .cur{background:rgba(255,110,0,.7)}
.gbox{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:0 12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--onnavy);padding:9px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="#/"><img src="logo.svg" alt="" width="30" height="30">Hukum<span>Pedia</span></a>
    <span id="auth"></span>
    <button id="theme" type="button" aria-label="Ganti tema">Tema</button>
  </div>
  <nav id="nav">
    <a href="#/" data-k="pasal">Pasal</a>
    <a href="#/kitab" data-k="kitab">Kitab</a>
    <a href="#/kamus" data-k="kamus">Kamus</a>
    <a href="#/simpan" data-k="simpan">Tersimpan</a>
    <a href="#/admin" data-k="admin" id="adm" hidden>Editor</a>
  </nav>
</header>
<main id="app"></main>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== Konfigurasi Supabase (kunci publishable aman di sisi klien; RLS menjaga data) ====== */
const SUPABASE_URL = "https://kacupvprosjcfsytmwxp.supabase.co";
const SUPABASE_KEY = "sb_publishable_Z-xJzXWqdLBn5nsqNSC3vA_gok7JcEA";

const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let USER = null, ROLE = null, RECOVERY = false, VIEW = null, cur = null, loginMode = "in", KL = "", EDIT = false;
const KF = { sel: new Set(), selecting: false }, PF = { sel: new Set(), selecting: false }, GF = { sel: new Set(), selecting: false };
let LAST = "";
const isAdmin = () => ROLE === "admin";

/* ---------- Util ---------- */
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hl = (t, q) => { t = esc(t); if (!q) return t; const r = q.trim().replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); return r ? t.replace(new RegExp("(" + r + ")", "gi"), "<mark>$1</mark>") : t; };
const val = id => $("#" + id).value.trim();
const say = (id, m) => { const e = $("#" + id); if (e) e.innerHTML = m; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2200); };
const empty = m => `<div class="empty">${m}</div>`;
const must = ({ data, error }) => { if (error) throw error; return data; };
const store = { get() { try { return JSON.parse(localStorage.getItem("hp_bm") || "[]"); } catch { return []; } }, set(v) { try { localStorage.setItem("hp_bm", JSON.stringify(v)); } catch {} } };
const slugify = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const tr = m => /Invalid login/i.test(m) ? "Email atau kata sandi salah." : /not confirmed/i.test(m) ? "Email belum dikonfirmasi. Cek kotak masuk Anda." : /already registered/i.test(m) ? "Email sudah terdaftar. Silakan masuk." : /rate limit/i.test(m) ? "Terlalu banyak percobaan. Coba lagi beberapa menit lagi." : m;
const lbl = a => /^\d/.test(a.pasal) ? "Pasal " + a.pasal : a.pasal;
const snip = (t, q) => { const i = q ? t.toLowerCase().indexOf(q.toLowerCase()) : -1; if (i < 0) return t.length > 200 ? t.slice(0, 200) + "…" : t; const s = Math.max(0, i - 60), e = Math.min(t.length, i + 160); return (s ? "…" : "") + t.slice(s, e) + (e < t.length ? "…" : ""); };

/* Penanda ayat/huruf/angka, toleran salah-baca OCR: (l) -> (1), l2l -> (2) */
const MK = line => {
  let m = line.match(/^[(\[]\s*([0-9lIO]{1,2}[a-z]?)\s*[)\]l]\s*(.*)$/) || line.match(/^[lI]([0-9]{1,2})[lI]\s+(.*)$/);
  if (m) return { t: "ay", k: "(" + m[1].replace(/[lI]/g, "1").replace(/O/g, "0") + ")", rest: m[2] };
  if ((m = line.match(/^([a-z])[.)]\s+(.*)$/))) return { t: "hu", k: m[1] + ".", rest: m[2] };
  if ((m = line.match(/^(\d{1,2})\.\s+(.*)$/))) return { t: "an", k: m[1] + ".", rest: m[2] };
  return null;
};
const fmt = t => String(t ?? "").split("\n").map(l => { const m = MK(l.trim()); return m ? `<p class="${m.t}">${esc(m.k)} ${esc(m.rest)}</p>` : `<p>${esc(l)}</p>`; }).join("");

/* ---------- Data ---------- */
const lawCache = {};
const lawOf = async slug => lawCache[slug] ||= await API.law(slug);
const API = {
  laws: async () => must(await sb.from("laws").select("*").order("year")),
  law: async s => must(await sb.from("laws").select("*").eq("slug", s).maybeSingle()),
  articles: async s => must(await sb.from("articles").select("*").eq("law_slug", s).order("ord")),
  article: async id => must(await sb.from("articles").select("*").eq("id", id).maybeSingle()),
  byIds: async ids => ids.length ? must(await sb.from("articles").select("*").in("id", ids)) : [],
  glossary: async () => must(await sb.from("glossary").select("*").order("term")),
  async search(term) {
    const t = term.replace(/[,()%*]/g, " ").trim(), m = t.match(/^pasal\s+(\d+\w*)$/i), aq = sb.from("articles").select("*").limit(100);
    const [a, g] = await Promise.all([
      m ? aq.eq("pasal", m[1]) : aq.or(`text.ilike.%${t}%,penjelasan.ilike.%${t}%,bab_title.ilike.%${t}%`),
      sb.from("glossary").select("*").or(`term.ilike.%${t}%,definition.ilike.%${t}%`).limit(20)
    ]);
    return { articles: must(a), terms: must(g) };
  }
};

/* ---------- Akun ---------- */
async function loadUser() {
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  USER = data.session?.user || null; ROLE = null;
  if (USER) { const r = await sb.from("profiles").select("role").eq("id", USER.id).maybeSingle(); ROLE = r.data?.role || "member"; }
  $("#auth").innerHTML = USER ? `<span>${esc(USER.email)} (${ROLE})</span><button id="out" type="button">Keluar</button>` : "";
  $("#adm").hidden = !isAdmin();
  document.body.classList.toggle("guest", !USER || RECOVERY);
}
if (sb) {
  document.body.classList.add("guest");
  sb.auth.onAuthStateChange(ev => {
    if (ev === "TOKEN_REFRESHED") return;
    if (ev === "PASSWORD_RECOVERY") RECOVERY = true;
    setTimeout(async () => { const before = USER?.id; await loadUser(); if (before !== USER?.id || ev === "PASSWORD_RECOVERY" || ev === "USER_UPDATED") route(); }, 0);
  });
}
const authReady = loadUser();
async function gate(app) {
  if (!sb) { app.innerHTML = empty("Isi SUPABASE_URL dan SUPABASE_KEY di index.html."); return true; }
  await authReady;
  if (RECOVERY) { V.recovery(app); return true; }
  if (USER) return false;
  V.login(app, loginMode); return true;
}

/* ---------- Tampilan ---------- */
const artForm = (a, slug) => `<form id="ef" class="frm" style="margin:14px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:6px"><h3 style="margin:0">${a ? "Edit " + esc(lbl(a)) : "Tambah pasal"}</h3>
  <input type="hidden" id="e-id" value="${esc(a?.id || "")}"><input type="hidden" id="e-slug" value="${esc(slug)}"><input type="hidden" id="e-ord" value="${a?.ord ?? ""}"><input type="hidden" id="e-page" value="${a?.page ?? ""}">
  <input id="e-pasal" placeholder="Nomor pasal" required value="${esc(a?.pasal || "")}"><input id="e-bab" placeholder="Bab (angka romawi)" value="${esc(a?.bab || "")}"><input id="e-bt" placeholder="Judul bab" value="${esc(a?.bab_title || "")}">
  <textarea id="e-text" rows="8" required placeholder="Isi pasal (satu ayat/huruf per baris)">${esc(a?.text || "")}</textarea><textarea id="e-pj" rows="3" placeholder="Penjelasan">${esc(a?.penjelasan || "")}</textarea>
  <div class="row" style="margin:0"><button class="p" type="submit">Simpan</button><button type="button" data-act="cancelEdit">Batal</button></div></form>`;
const lawItem = l => `<a class="item" href="#/law/${esc(l.slug)}"><b class="serif">${esc(l.short)}</b><small>${esc(l.title)}</small><div class="meta"><span class="tag">${esc(l.subject || "")}</span>${l.year || ""}</div></a>`;
const card = (a, l, q) => `<a class="item" href="#/a/${enc(a.id)}"><b class="serif">${esc(lbl(a))}</b><small>${esc(l ? l.short : "")}${a.bab_title ? " · " + esc(a.bab_title) : ""}</small><div>${hl(snip(a.text, q), q)}</div></a>`;
const chk = (set, key, attr) => set.selecting ? `<label><input type="checkbox" data-${attr}="${esc(key)}" ${set.sel.has(String(key)) ? "checked" : ""}> Pilih</label>` : "";
const lawAdmin = l => isAdmin() ? `<div class="row" style="margin:-4px 0 12px">${chk(PF, l.slug, "psel")}<button data-act="editdoc" data-s="${esc(l.slug)}">Edit</button><button data-act="deldoc" data-s="${esc(l.slug)}">Hapus</button></div>` : "";
const artAdmin = a => isAdmin() ? `<div class="row" style="margin:-4px 0 12px">${chk(PF, a.id, "psel")}<button data-act="gotoedit" data-id="${esc(a.id)}">Edit</button><button data-act="delart2" data-id="${esc(a.id)}">Hapus</button></div>` : "";
const pTool = what => isAdmin() ? `<div class="row"><button data-act="psel">${PF.selecting ? "Selesai memilih" : "Pilih"}</button>${PF.selecting ? `<button data-act="pdel" data-what="${what}" id="pdelb">Hapus terpilih (${PF.sel.size})</button>` : ""}</div>` : "";
const V = {
  login(app, mode = "in") {
    loginMode = mode;
    const pw = mode !== "reset" ? `<input id="pw" type="password" placeholder="Kata sandi (min. 6 karakter)" required minlength="6" autocomplete="${mode === "in" ? "current-password" : "new-password"}">` : "";
    const pw2 = mode === "up" ? `<input id="pw2" type="password" placeholder="Ulangi kata sandi" required minlength="6" autocomplete="new-password">` : "";
    const links = { in: `<button class="lnk" type="button" data-m="reset">Lupa kata sandi?</button> · <button class="lnk" type="button" data-m="up">Daftar akun baru</button>`, up: `Sudah punya akun? <button class="lnk" type="button" data-m="in">Masuk</button>`, reset: `<button class="lnk" type="button" data-m="in">Kembali ke halaman masuk</button>` }[mode];
    app.innerHTML = `<div class="auth"><img src="logo.svg" alt="HukumPedia" width="64" height="64" style="display:block;margin-bottom:12px"><h1>${{ in: "Masuk", up: "Daftar akun", reset: "Lupa kata sandi" }[mode]}</h1>
    <p class="sub">${mode === "reset" ? "Masukkan email Anda. Kami kirim tautan untuk membuat kata sandi baru." : "HukumPedia: kitab, pasal, dan istilah hukum untuk advokat dan mahasiswa hukum."}</p>
    <form id="lf" class="frm"><input id="em" type="email" placeholder="Email" required autocomplete="email">${pw}${pw2}<button class="p" type="submit">${{ in: "Masuk", up: "Daftar", reset: "Kirim tautan reset" }[mode]}</button></form>
    <p id="lm" class="meta" role="status"></p><p class="meta">${links}</p>
    ${mode === "up" ? `<p class="meta">Akun baru otomatis berperan member (membaca, mencari, mengunduh). Peran editor diberikan oleh pengelola.</p>` : ""}</div>`;
  },
  recovery(app) {
    app.innerHTML = `<div class="auth"><img src="logo.svg" alt="HukumPedia" width="64" height="64" style="display:block;margin-bottom:12px"><h1>Kata sandi baru</h1><p class="sub">Buat kata sandi baru untuk akun Anda.</p>
    <form id="rf" class="frm"><input id="np" type="password" placeholder="Kata sandi baru (min. 6 karakter)" required minlength="6" autocomplete="new-password"><input id="np2" type="password" placeholder="Ulangi kata sandi baru" required minlength="6" autocomplete="new-password"><button class="p" type="submit">Simpan kata sandi</button></form><p id="lm" class="meta" role="status"></p></div>`;
  },

  async pasal(q) {
    const laws = await API.laws(); laws.forEach(l => lawCache[l.slug] = l);
    let h = `<h1>Cari pasal</h1><p class="sub">Ketik kata kunci. Semua pasal yang memuatnya tampil, dikelompokkan per peraturan beserta sumbernya.</p>
    <form id="sf" class="row"><input id="q" type="search" value="${esc(q)}" placeholder="Contoh: penyidikan, wanprestasi, pasal 338" aria-label="Kata kunci" style="flex:1 1 240px"><button class="p" type="submit">Cari</button></form>${isAdmin() ? `<div class="row"><button class="p" data-act="adddoc" data-j="peraturan">+ Tambah peraturan (PDF)</button></div><div id="addbox"></div>` : ""}`;
    if (!q) { const L = laws.filter(l => l.grp === "peraturan"); return h + `<h2 class="bab">Peraturan perundang-undangan</h2>` + (L.length ? pTool("laws") + L.map(l => lawItem(l) + lawAdmin(l)).join("") : empty("Belum ada peraturan. Editor dapat menambahkannya lewat menu Editor.")); }
    const r = await API.search(q), by = {};
    r.articles.forEach(a => (by[a.law_slug] ||= []).push(a));
    h += `<p class="sub">${r.articles.length} pasal dalam ${Object.keys(by).length} peraturan${r.terms.length ? ", " + r.terms.length + " istilah" : ""}</p>`;
    if (r.terms.length) h += `<h2 class="bab">Istilah</h2><dl>` + r.terms.map(g => `<dt>${hl(g.term, q)}</dt><dd>${hl(g.definition, q)}</dd>`).join("") + `</dl>`;
    if (r.articles.length) h += pTool("arts");
    for (const [slug, list] of Object.entries(by)) { const l = lawCache[slug]; h += `<div class="grp"><a href="#/law/${esc(slug)}"><b class="serif">${esc(l ? l.title : slug)}</b></a><small>${esc(l ? l.short : "")} · ${list.length} pasal ditemukan</small></div>` + list.map(a => card(a, l, q) + artAdmin(a)).join(""); }
    return h + (r.articles.length || r.terms.length ? "" : empty("Tidak ada hasil. Coba kata kunci lain atau format “pasal 338”."));
  },
  async law(slug) {
    const [l, arts] = await Promise.all([lawOf(slug), API.articles(slug)]);
    if (!l) return empty("Peraturan tidak ditemukan.");
    let h = `<a class="crumb" href="#/">← Pasal</a><h1>${esc(l.short)}</h1><p class="sub">${esc(l.title)}</p><p class="pj">${esc(l.description || "")}</p>

async function pdfPages(file, cb) {

}

const docForm = l => `<form id="df" class="frm" style="margin:14px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:6px"><h3 style="margin:0">${l ? "Edit info dokumen" : "Tambah dokumen dari PDF"}</h3>
  <input type="hidden" id="d-slug" value="${esc(l?.slug || "")}">
  <label class="meta">${l ? "Ganti file PDF (opsional)" : "File PDF"}<input id="d-file" type="file" accept="application/pdf" style="display:block;width:100%"></label><p id="d-st" class="meta" role="status"></p>
  <input id="d-title" placeholder="Judul lengkap" required value="${esc(l?.title || "")}"><input id="d-short" placeholder="Nama singkat (mis. UU 20/2025 atau KUHP)" required value="${esc(l?.short || "")}"><input id="d-author" placeholder="Penulis / penerbit (opsional)" value="${esc(l?.author || "")}">
  <div class="row" style="margin:0"><input id="d-year" type="number" placeholder="Tahun" value="${l?.year ?? ""}" style="width:110px"><input id="d-subject" placeholder="Bidang, mis. Pidana" value="${esc(l?.subject || "")}" style="flex:1"></div>
  <select id="d-grp" aria-label="Jenis"><option value="kitab">Kitab / buku (tampil di menu Kitab)</option><option value="peraturan">Peraturan / undang-undang (tampil di menu Pasal)</option></select>
  <textarea id="d-desc" rows="2" placeholder="Deskripsi singkat (opsional)">${esc(l?.description || "")}</textarea>
  <label><input id="d-parse" type="checkbox"> Baca isi PDF dan pecah per pasal otomatis${l ? " (menggantikan pasal lama)" : ""}</label>
  <div class="row" style="margin:0"><button class="p" type="submit">Simpan</button><button type="button" data-act="cancelEdit">Batal</button></div></form>`;
async function saveDoc() {
  const st = m => say("d-st", m), old = val("d-slug"), file = $("#d-file").files[0], parse = $("#d-parse").checked;
  const base = { short: val("d-short"), title: val("d-title"), author: val("d-author") || null, grp: $("#d-grp").value, type: val("d-short"), year: +val("d-year") || null, subject: val("d-subject") || null, description: val("d-desc") || null };
  let slug = old;
  if (!old) {
    if (!file) return st("Pilih file PDF dulu.");
    const ex = (await API.laws()).map(l => l.slug), b0 = slugify(base.short) || slugify(base.title).slice(0, 40) || "dokumen"; slug = b0; for (let i = 2; ex.includes(slug); i++) slug = b0 + "-" + i;
  }
  if (parse && !file) return st("Pilih file PDF untuk dibaca per pasal.");
  const btn = $("#df button.p"); btn.disabled = true;
  try {
    st("Menyimpan data…"); const r = await sb.from("laws").upsert({ slug, ...base }); if (r.error) throw r.error;
    let n = 0, scan = false;
    if (file && parse) {
      const pages = await pdfPages(file, (i, t) => st(`Membaca halaman ${i} dari ${t}…`));
      if (pages.join("").length < 100) scan = true;
      else {
        const rows = parseArticles(pages, slug); n = rows.length;
        if (old) { const d = await sb.from("articles").delete().eq("law_slug", slug); if (d.error) throw d.error; }
        for (let i = 0; i < rows.length; i += 100) { const x = await sb.from("articles").upsert(rows.slice(i, i + 100)); if (x.error) throw x.error; }
      }
    }
    if (file) {
      st("Mengunggah PDF…"); const u = await sb.storage.from("documents").upload(slug + ".pdf", file, { upsert: true, contentType: "application/pdf" }); if (u.error) throw u.error;
      const r2 = await sb.from("laws").update({ pdf_path: slug + ".pdf" }).eq("slug", slug); if (r2.error) throw r2.error;
    }
    delete lawCache[slug]; toast(scan ? "Tersimpan. PDF hasil scan tidak dipecah per pasal." : n ? `Tersimpan: ${n} entri pasal.` : "Tersimpan."); route();
  } catch (e) { st("Gagal: " + esc(e.message || e)); btn.disabled = false; }
}
async function delDocs(slugs) {
  const laws = await Promise.all(slugs.map(s => API.law(s))), paths = laws.filter(l => l && l.pdf_path).map(l => l.pdf_path);
  const r = await sb.from("laws").delete().in("slug", slugs); if (r.error) throw r.error;
  if (paths.length) await sb.storage.from("documents").remove(paths);
  slugs.forEach(x => delete lawCache[x]);
}

/* ---------- Panel editor (admin) ---------- */
V.admin = async function (app) {
  if (!isAdmin()) { app.innerHTML = empty("Halaman ini khusus editor (admin)."); return; }
  app.innerHTML = `<h1>Panel editor</h1>
  <h2 class="bab">Tambah dokumen dari PDF</h2>
  <p class="meta">Pilih PDF, lalu judul, tahun, dan jenisnya terbaca otomatis; semua isian tetap bisa Anda sunting.</p>
  <div class="row"><button class="p" data-act="adddoc" data-j="kitab">+ Tambah kitab / buku</button><button class="p" data-act="adddoc" data-j="peraturan">+ Tambah peraturan / UU</button></div><div id="addbox"></div>
  <h2 class="bab">Mengubah dan menghapus</h2>
  <p class="meta">Tombol Edit, Hapus, dan Pilih ada langsung di tiap halaman: <a href="#/kitab"><u>Kitab</u></a> (kartu kitab), <a href="#/"><u>Pasal</u></a> (peraturan dan hasil pencarian pasal), halaman pasal, dan <a href="#/kamus"><u>Kamus</u></a> (istilah).</p>`;
};

/* ---------- Router ---------- */
async function route() {
  VIEW && VIEW(); VIEW = null;
  let raw = location.hash.slice(1) || "/"; try { raw = decodeURIComponent(raw); } catch {}
  if (/error_description=/.test(raw)) { const m = raw.match(/error_description=([^&]+)/); toast((m ? m[1].replace(/\+/g, " ") : "Tautan tidak valid") + "."); raw = "/"; }
  if (/access_token=|refresh_token=|type=recovery|type=signup|error=/.test(raw)) raw = "/";
  if (raw !== LAST) { PF.selecting = false; PF.sel.clear(); GF.selecting = false; GF.sel.clear(); LAST = raw; }
  const p = raw.split("/").filter(Boolean), app = $("#app");
  const k = !p.length || p[0] === "cari" ? "pasal" : ["kitab", "kamus", "simpan", "admin"].includes(p[0]) ? p[0] : "";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.k === k));
  document.documentElement.style.setProperty("--hh", $("header").offsetHeight + "px");
  app.innerHTML = `<p class="sub">Memuat…</p>`;
  if (await gate(app)) return;
  document.documentElement.style.setProperty("--hh", $("header").offsetHeight + "px");
  try {
    if (!p.length) app.innerHTML = await V.pasal("");
    else if (p[0] === "cari") app.innerHTML = await V.pasal(p.slice(1).join("/"));
    else if (p[0] === "law") app.innerHTML = await V.law(p[1]);
    else if (p[0] === "a") app.innerHTML = await V.article(p.slice(1).join("/"));
    else if (p[0] === "kitab") { if (p[1]) await V.kitabView(app, p[1], +p[2] || 0); else { app.innerHTML = await V.kitab(); $("#kq").oninput = $("#ks").onchange = $("#ko").onchange = paintKitab; paintKitab(); } }
    else if (p[0] === "kamus") { app.innerHTML = await V.kamus(); $("#kf").oninput = paintKamus; paintKamus(); }
    else if (p[0] === "simpan") app.innerHTML = await V.simpan();
    else if (p[0] === "admin") await V.admin(app);
    else app.innerHTML = empty("Halaman tidak ditemukan.");
  } catch (e) { console.error(e); app.innerHTML = empty("Gagal memuat: " + esc(e.message || e) + "<br>Periksa koneksi, kunci Supabase, dan apakah file SQL sudah dijalankan."); }
  if (!(p[0] === "kitab" && p[2])) window.scrollTo(0, 0);
}
addEventListener("hashchange", route);

/* ---------- Aksi ---------- */
document.addEventListener("submit", async e => {
  const f = e.target.id;
  if (f === "sf") { e.preventDefault(); const v = val("q"); location.hash = v ? "#/cari/" + enc(v) : "#/"; }
  if (f === "tf") {
    e.preventDefault(); if (!isAdmin()) return; const old = val("t-old"), term = val("t-term");
    try {
      if (old && old !== term) { const d = await sb.from("glossary").delete().eq("term", old); if (d.error) throw d.error; }
      const r = await sb.from("glossary").upsert({ term, definition: val("t-def") }, { onConflict: "term" }); if (r.error) throw r.error;
      V.kd = await API.glossary(); $("#addbox").innerHTML = ""; paintKamus(); toast("Istilah tersimpan.");
    } catch (x) { toast("Gagal: " + x.message); }
  }
  if (f === "df") { e.preventDefault(); if (isAdmin()) await saveDoc(); }
  if (f === "ef") {
    e.preventDefault(); if (!isAdmin()) return;
    const slug = val("e-slug"), pasal = val("e-pasal"), isNew = !val("e-id");
    const row = { id: val("e-id") || `${slug}-${pasal}`.toLowerCase().replace(/\s+/g, "-"), law_slug: slug, pasal, bab: val("e-bab") || null, bab_title: val("e-bt") || null, text: val("e-text"), penjelasan: val("e-pj") || "Cukup jelas.", ord: +val("e-ord") || parseInt(pasal) || 999 };
    if (+val("e-page")) row.page = +val("e-page");
    const r = await sb.from("articles").upsert(row); if (r.error) return toast("Gagal menyimpan: " + r.error.message);
    toast("Pasal tersimpan."); if (isNew) location.hash = "#/a/" + enc(row.id); else route();
  }
  if (f === "lf") {
    e.preventDefault(); const email = val("em"), pw = $("#pw") ? $("#pw").value : "", btn = e.target.querySelector("button.p"), back = location.origin + location.pathname; btn.disabled = true;
    try {
      if (loginMode === "in") { const { error } = await sb.auth.signInWithPassword({ email, password: pw }); if (error) say("lm", esc(tr(error.message))); }
      else if (loginMode === "up") { if (pw !== $("#pw2").value) say("lm", "Kata sandi tidak sama."); else { const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: back } }); say("lm", error ? esc(tr(error.message)) : data.session ? "Berhasil mendaftar." : "Kami mengirim email konfirmasi. Buka tautannya, lalu masuk."); } }
      else { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: back }); say("lm", error ? esc(tr(error.message)) : "Jika email terdaftar, tautan reset kata sandi sudah dikirim. Cek kotak masuk dan folder spam."); }
    } finally { btn.disabled = false; }
  }
  if (f === "rf") {
    e.preventDefault(); if ($("#np").value !== $("#np2").value) return say("lm", "Kata sandi tidak sama.");
    const { error } = await sb.auth.updateUser({ password: $("#np").value }); if (error) return say("lm", esc(tr(error.message)));
    RECOVERY = false; toast("Kata sandi diperbarui."); location.hash = "#/"; await loadUser(); route();
  }
});
document.addEventListener("click", async e => {
  if (e.target.id === "out") { await sb.auth.signOut(); return; }
  const b = e.target.closest("[data-act],[data-m],[data-l]"); if (!b) return; const d = b.dataset;
  try {
    if (d.m) return V.login($("#app"), d.m);
    if (d.l !== undefined) { KL = d.l; return paintKamus(); }
    if (d.act === "openpdf") location.hash = "#/kitab/" + d.s;
    if (d.act === "dlpdf") await dlPdf(d.s);
    if (d.act === "dltxt") { const l = await lawOf(d.s), arts = await API.articles(d.s), t = l.title + "\n\n" + arts.map(a => `${lbl(a)}\n${a.text}`).join("\n\n"), a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/plain" })); a.download = d.s + ".txt"; a.click(); }
    if (d.act === "adddoc") { if (isAdmin()) { $("#addbox").innerHTML = docForm(null); $("#d-grp").value = d.j; $("#addbox").scrollIntoView(); } return; }
    if (d.act === "editdoc") { if (isAdmin()) { const l = await API.law(d.s); $("#addbox").innerHTML = docForm(l); $("#d-grp").value = l.grp; $("#addbox").scrollIntoView(); } return; }
    if (d.act === "deldoc") { if (isAdmin() && confirm("Hapus dokumen ini beserta PDF dan semua pasalnya?")) { await delDocs([d.s]); toast("Dokumen dihapus."); if (location.hash.startsWith("#/law")) location.hash = "#/"; else route(); } return; }
    if (d.act === "selmode") { KF.selecting = !KF.selecting; KF.sel.clear(); b.textContent = KF.selecting ? "Selesai memilih" : "Pilih"; $("#delb").hidden = !KF.selecting; $("#delb").textContent = "Hapus terpilih (0)"; paintKitab(); return; }
    if (d.act === "delsel") { const n = KF.sel.size; if (n && isAdmin() && confirm(`Hapus ${n} dokumen terpilih beserta PDF dan pasalnya?`)) { await delDocs([...KF.sel]); toast(n + " dokumen dihapus."); route(); } return; }
    if (d.act === "psel") { PF.selecting = !PF.selecting; PF.sel.clear(); route(); return; }
    if (d.act === "pdel") { const n = PF.sel.size; if (n && isAdmin() && confirm(`Hapus ${n} ${d.what === "laws" ? "dokumen beserta PDF dan pasalnya" : "pasal"} terpilih?`)) { if (d.what === "laws") await delDocs([...PF.sel]); else { const r = await sb.from("articles").delete().in("id", [...PF.sel]); if (r.error) throw r.error; } PF.sel.clear(); PF.selecting = false; toast(n + " item dihapus."); route(); } return; }
    if (d.act === "delart2") { if (isAdmin() && confirm("Hapus pasal ini?")) { const r = await sb.from("articles").delete().eq("id", d.id); if (r.error) throw r.error; toast("Pasal dihapus."); route(); } return; }
    if (d.act === "addterm") { if (isAdmin()) { $("#addbox").innerHTML = termForm(null); $("#t-term").focus(); } return; }
    if (d.act === "editterm") { if (isAdmin()) { $("#addbox").innerHTML = termForm(V.kd.find(x => String(x.id) === d.id)); $("#addbox").scrollIntoView(); } return; }
    if (d.act === "delterm") { if (isAdmin() && confirm("Hapus istilah ini?")) { const r = await sb.from("glossary").delete().eq("id", d.id); if (r.error) throw r.error; V.kd = await API.glossary(); paintKamus(); toast("Istilah dihapus."); } return; }
    if (d.act === "gsel") { GF.selecting = !GF.selecting; GF.sel.clear(); b.textContent = GF.selecting ? "Selesai memilih" : "Pilih"; $("#gdelb").hidden = !GF.selecting; $("#gdelb").textContent = "Hapus terpilih (0)"; paintKamus(); return; }
    if (d.act === "gdel") { const n = GF.sel.size; if (n && isAdmin() && confirm(`Hapus ${n} istilah terpilih?`)) { const r = await sb.from("glossary").delete().in("id", [...GF.sel]); if (r.error) throw r.error; GF.sel.clear(); V.kd = await API.glossary(); paintKamus(); $("#gdelb").textContent = "Hapus terpilih (0)"; toast(n + " istilah dihapus."); } return; }
    if (d.act === "gotoedit") { EDIT = true; location.hash = "#/a/" + enc(d.id); return; }
    if (d.act === "addart") { if (isAdmin()) $("#addbox").innerHTML = artForm(null, d.s); return; }
    if (d.act === "cancelEdit") { b.closest("form").remove(); return; }
    if (!cur || !["copy", "cite", "bm", "pdf", "editart", "delart"].includes(d.act)) return;
    if (d.act === "editart") { if (isAdmin()) { $("#edit").innerHTML = artForm(cur, cur.law_slug); $("#edit").scrollIntoView(); } return; }
    if (d.act === "delart") { if (isAdmin() && confirm("Hapus " + lbl(cur) + " dari dokumen ini?")) { const r = await sb.from("articles").delete().eq("id", cur.id); if (r.error) throw r.error; toast("Pasal dihapus."); location.hash = "#/law/" + cur.law_slug; } return; }
    const l = await lawOf(cur.law_slug);
    if (d.act === "copy") { await navigator.clipboard.writeText(`${lbl(cur)} ${l ? l.short : ""}\n${cur.text}`); toast("Teks disalin"); }
    if (d.act === "cite") { await navigator.clipboard.writeText(`${lbl(cur)} ${l ? l.title : ""}`); toast("Kutipan disalin"); }
    if (d.act === "pdf") location.hash = `#/kitab/${cur.law_slug}/${cur.page}`;
    if (d.act === "bm") { const s = store.get(), i = s.indexOf(cur.id); i < 0 ? s.push(cur.id) : s.splice(i, 1); store.set(s); b.textContent = i < 0 ? "Hapus dari tersimpan" : "Simpan pasal"; toast(i < 0 ? "Pasal disimpan" : "Pasal dihapus"); }

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "d-file" && t.files[0]) autofill(t.files[0]);
  if (t.dataset.psel) { t.checked ? PF.sel.add(t.dataset.psel) : PF.sel.delete(t.dataset.psel); const b = $("#pdelb"); if (b) b.textContent = `Hapus terpilih (${PF.sel.size})`; }
